<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CPS Referral Directory | Fordham University</title>
  <meta name="description" content="Search off-campus mental health providers for student referrals" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="brand-bar"></div>
  <header class="header">
    <div class="header-inner">
      <div class="header-brand">
        <img
          class="fordham-seal"
          src="assets/fordham-seal.png"
          alt="Fordham University seal"
          width="54"
          height="70"
        />
        <div>
          <p class="eyebrow">Fordham Counseling &amp; Psychological Services</p>
          <h1>Referral Directory</h1>
        </div>
      </div>
      <div id="staff-controls"></div>
    </div>
  </header>

  <main class="layout">
    <aside id="filters" class="filters"></aside>
    <section class="results">
      <div class="results-bar">
        <p id="result-count" class="result-count"></p>
        <div class="results-actions">
          <input id="staff-name" type="text" placeholder="Your name for comments" class="staff-name hidden" />
          <button id="add-provider-btn" class="btn btn-accent hidden" type="button">+ Add provider</button>
        </div>
      </div>
      <div id="provider-grid" class="provider-grid"></div>
    </section>
  </main>

  <footer class="footer">
    Created by Sally Shi (2025–26 Postgraduate Fellow, Lincoln Center)
  </footer>

  <div id="modal-root" class="modal-root hidden"></div>

  <script src="assets/config.js"></script>
  <script src="assets/app.js" type="module"></script>
</body>
</html>
